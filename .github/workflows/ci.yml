name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache models and test images
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('face_match/model_store.py') }}
      - run: pip install -e ".[dev,postgres]"
      - run: face-match download-models
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facematch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACE_MATCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facematch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache models and test images
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('face_match/model_store.py') }}
      - run: pip install -e ".[dev,postgres]"
      - run: face-match download-models
      - name: Run the full suite against PostgreSQL
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[postgres]" pip-audit
      - name: Check dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: face-match:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: face-match:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test the image
        run: |
          docker run -d --name fm -p 8000:8000 -e API_KEY=ci-key face-match:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/persons)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-key' localhost:8000/api/v1/persons)" = "200"
          docker stats --no-stream fm
      - name: Container logs
        if: always()
        run: docker logs fm || true
