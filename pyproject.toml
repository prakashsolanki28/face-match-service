[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "face-match-service"
dynamic = ["version"]
description = "Lightweight, self-hosted face detection and face matching service with a REST API, enrollment, and built-in attendance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Prakash Solanki" }]
keywords = ["face recognition", "face detection", "face matching", "attendance", "rest api", "opencv", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Minimum versions are set at releases with known vulnerabilities fixed (checked with pip-audit).
dependencies = [
    "fastapi>=0.115,<1.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "uvicorn>=0.30",
    "python-multipart>=0.0.31",
    "opencv-python-headless>=4.9,<6",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pip-audit>=2.7"]
# Several FaceMatch servers sharing one PostgreSQL database (DATABASE_URL=postgresql://...)
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
face-match = "face_match.cli:main"

[project.urls]
Homepage = "https://github.com/prakashsolanki28/face-match-service"
Documentation = "https://github.com/prakashsolanki28/face-match-service/tree/main/docs"
Issues = "https://github.com/prakashsolanki28/face-match-service/issues"
Changelog = "https://github.com/prakashsolanki28/face-match-service/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "face_match/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["face_match"]

[tool.hatch.build.targets.sdist]
include = ["face_match", "tests", "docs", "api", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in argument defaults is the framework's idiom
    "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional style kept for a smaller diff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
