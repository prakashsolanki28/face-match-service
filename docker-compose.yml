# Quick start:
#   1. echo "API_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" > .env
#   2. docker compose up -d
#   3. curl http://localhost:8000/health   (API only; see docs/api.md)
services:
  face-match:
    image: ghcr.io/prakashsolanki28/face-match-service:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      # TIMEZONE: Asia/Kolkata
      # WEBHOOK_URL: https://your-portal.example.com/hooks/face-match
      # WEBHOOK_SECRET: change-me
    volumes:
      - face-match-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  face-match-data:
