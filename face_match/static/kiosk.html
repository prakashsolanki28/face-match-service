<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FaceMatch Kiosk</title>
<style>
  :root { --bg: #0b0d10; --text: #f4f6f8; --muted: #a3acb9; --card: rgba(15, 18, 23, 0.82);
    --welcome: #16a34a; --info: #2563eb; --warn: #7c3aed; --bad: #c2410c; --idle: #374151; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .guide { position: fixed; left: 50%; top: 44%; width: min(46vw, 46vh); aspect-ratio: 3 / 4;
    transform: translate(-50%, -50%); border: 3px dashed rgba(255, 255, 255, 0.45); border-radius: 50%; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 24px 16px;
    background: linear-gradient(rgba(0, 0, 0, 0.55), transparent); font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; font-size: 22px; }
  .status { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(92vw, 720px); padding: 22px 28px; border-radius: 20px; background: var(--card);
    border-left: 10px solid var(--idle); backdrop-filter: blur(6px); transition: border-color .2s; }
  .status h1 { margin: 0; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.15; }
  .status p { margin: 6px 0 0; color: var(--muted); font-size: clamp(16px, 2.2vw, 22px); }
  .status.welcome { border-color: var(--welcome); } .status.info { border-color: var(--info); }
  .status.warn { border-color: var(--warn); } .status.bad { border-color: var(--bad); }
  .corner { position: fixed; top: 0; right: 0; width: 72px; height: 72px; }
  .setup { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 16px; }
  .setup form { width: min(440px, 100%); background: #151920; padding: 24px; border-radius: 16px; }
  .setup h2 { margin: 0 0 6px; } .setup p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .setup label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .setup input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2f38; background: #0f1115;
    color: var(--text); font: inherit; }
  .setup button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #4f46e5;
    color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .setup .error { color: #fb923c; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="guide" aria-hidden="true"></div>
<div class="top"><span id="device">FaceMatch</span><span class="clock" id="clock"></span></div>
<div class="status" id="status" role="status" aria-live="polite"><h1 id="title">Starting…</h1><p id="detail"></p></div>
<div class="corner" id="corner" aria-hidden="true"></div>

<div class="setup" id="setup" hidden>
  <form id="setupForm" autocomplete="off">
    <h2>Set up this kiosk</h2>
    <p>Paste a device key with only the <strong>attendance</strong> permission (Admin → Device keys).</p>
    <label for="keyInput">Device key</label>
    <input id="keyInput" type="password" required placeholder="fm_…">
    <label for="deviceInput">Kiosk name</label>
    <input id="deviceInput" type="text" placeholder="main-gate" maxlength="100">
    <button type="submit">Start kiosk</button>
    <div class="error" id="setupError"></div>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY_STORE = "faceMatch.kioskKey", DEVICE_STORE = "faceMatch.kioskDevice";
const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
                del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const state = { key: "", device: "", running: false, inflight: false, holdUntil: 0, unknownRun: 0, spoofRun: 0, backoff: 0 };
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// A setup link (#key=…&device=…) is stored once, then removed from the address bar.
(function readSetupLink() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("key")) {
    store.set(KEY_STORE, params.get("key"));
    if (params.get("device")) store.set(DEVICE_STORE, params.get("device"));
    history.replaceState(null, "", location.pathname);
  }
})();

function show(kind, title, detail = "", holdMs = 0) {
  if (Date.now() < state.holdUntil && kind !== "welcome") return;  // keep a greeting on screen briefly
  $("status").className = `status ${kind}`;
  $("title").textContent = title;
  $("detail").textContent = detail;
  if (holdMs) state.holdUntil = Date.now() + holdMs;
}

function setup(message = "") {
  state.running = false;
  $("setup").hidden = false;
  $("setupError").textContent = message;
  $("deviceInput").value = store.get(DEVICE_STORE);
}

$("setupForm").addEventListener("submit", (e) => {
  e.preventDefault();
  store.set(KEY_STORE, $("keyInput").value.trim());
  store.set(DEVICE_STORE, $("deviceInput").value.trim() || "kiosk");
  $("keyInput").value = "";
  start();
});

async function start() {
  state.key = store.get(KEY_STORE);
  state.device = store.get(DEVICE_STORE) || "kiosk";
  if (!state.key) return setup();
  $("setup").hidden = true;
  $("device").textContent = state.device;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    $("video").srcObject = stream;
    await $("video").play();
  } catch (err) {
    return show("bad", "Camera unavailable", err.name === "NotAllowedError" ? "Allow camera access for this page, then reload." : err.message);
  }
  keepAwake();
  state.running = true;
  show("idle", "Look at the camera to check in");
  loop();
}

function grab() {
  const v = $("video"), scale = Math.min(1, 640 / v.videoWidth);
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.85));
}

async function loop() {
  if (!state.running) return;
  let delay = 700;
  const v = $("video");
  if (!state.inflight && v.readyState >= 2 && v.videoWidth) {
    state.inflight = true;
    try {
      const form = new FormData();
      form.append("image", await grab(), "frame.jpg");
      form.append("device_id", state.device);
      const res = await fetch("/api/v1/attendance", { method: "POST", body: form, headers: { "X-API-Key": state.key } });
      if (res.status === 401 || res.status === 403) {
        store.del(KEY_STORE);
        return setup("This kiosk's key is invalid, revoked or lacks the attendance permission.");
      }
      if (res.status === 429 || res.status === 503) {
        delay = 1000 * Number(res.headers.get("Retry-After") || 2);
      } else if (!res.ok) {
        show("bad", "Something went wrong", `Server error ${res.status}. Retrying…`);
      } else {
        handle(await res.json());
        state.backoff = 0;
      }
    } catch {
      state.backoff = Math.min(10000, (state.backoff || 1000) * 2);
      delay = state.backoff;
      show("bad", "Connection lost", "Retrying…");
    } finally { state.inflight = false; }
  }
  setTimeout(loop, delay);
}

function handle(res) {
  const face = res.faces[0];  // largest face = the person in front of the kiosk
  if (!face) { state.unknownRun = state.spoofRun = 0; return show("idle", "Look at the camera to check in"); }
  const status = face.attendance.status;
  state.unknownRun = status === "unknown" ? state.unknownRun + 1 : 0;
  state.spoofRun = status === "liveness_failed" ? state.spoofRun + 1 : 0;
  if (status === "marked") show("welcome", `Welcome, ${face.match.name}`, `Checked in at ${hhmm(face.attendance.timestamp)}`, 3500);
  else if (status === "already_marked") show("info", `Hi ${face.match.name}`, `Already checked in at ${hhmm(face.attendance.timestamp)}`, 2500);
  else if (status === "too_small") show("idle", "Please come closer");
  else if (status === "liveness_failed" && state.spoofRun >= 2) show("warn", "Please look directly at the camera", "Photos and screens can't be used to check in");
  else if (status === "unknown" && state.unknownRun >= 3) show("bad", "Not recognised", "Please see the office to register");
}

// Keep the screen on while the kiosk runs.
let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.running) keepAwake(); });

// Hidden reset: tap the top-right corner three times within two seconds.
let taps = [];
$("corner").addEventListener("click", () => {
  taps = [...taps.filter((t) => Date.now() - t < 2000), Date.now()];
  if (taps.length >= 3 && confirm("Reset this kiosk? The device key will be removed.")) {
    store.del(KEY_STORE);
    location.reload();
  }
});

setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }, 1000);
$("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
start();
</script>
</body>
</html>
